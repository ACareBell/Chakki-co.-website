<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Loading...</title>
  <meta name="description" id="metaDesc" content="" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link id="fontLink" href="" rel="stylesheet" />
  <script src="config.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="#" class="nav-logo" id="navLogo"></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero" id="hero">
    <div class="container hero-container">
      <div class="hero-content">
        <p class="hero-badge" id="heroBadge"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-subtitle" id="heroSubtitle"></p>
        <div class="hero-actions" id="heroActions"></div>
        <div class="hero-stats" id="heroStats"></div>
      </div>
      <div class="hero-visual">
        <div class="hero-phone">
          <div class="phone-mockup">
            <div class="phone-screen" id="heroPhone"></div>
          </div>
        </div>
        <div id="heroFloats"></div>
      </div>
    </div>
    <div class="hero-wave">
      <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 60L48 52C96 44 192 28 288 24C384 20 480 28 576 40C672 52 768 68 864 72C960 76 1056 68 1152 56C1248 44 1344 28 1392 20L1440 12V120H0V60Z" fill="#ffffff"/>
      </svg>
    </div>
  </header>

  <!-- Social Proof -->
  <section class="social-proof">
    <div class="container">
      <p class="social-proof-text" id="proofHeadline"></p>
      <div class="proof-items" id="proofItems"></div>
    </div>
  </section>

  <!-- How It Works -->
  <section class="section" id="how-it-works">
    <div class="container">
      <div class="section-header" id="hiwHeader"></div>
      <div class="steps-grid" id="stepsGrid"></div>
    </div>
  </section>

  <!-- Features -->
  <section class="section section-alt" id="features">
    <div class="container">
      <div class="section-header" id="featuresHeader"></div>
      <div class="features-grid" id="featuresGrid"></div>
    </div>
  </section>

  <!-- Pricing -->
  <section class="section" id="pricing">
    <div class="container">
      <div class="section-header" id="pricingHeader"></div>
      <div class="pricing-grid" id="pricingGrid"></div>
      <div class="pricing-note" id="pricingNote"></div>
    </div>
  </section>

  <!-- For Societies -->
  <section class="section section-alt" id="societies">
    <div class="container">
      <div class="societies-layout" id="societiesLayout"></div>
    </div>
  </section>

  <!-- Testimonials -->
  <section class="section" id="testimonials">
    <div class="container">
      <div class="section-header" id="testimonialsHeader"></div>
      <div class="testimonials-grid" id="testimonialsGrid"></div>
    </div>
  </section>

  <!-- Download App -->
  <section class="section section-download" id="download">
    <div class="container">
      <div class="download-layout" id="downloadLayout"></div>
    </div>
  </section>

  <!-- Contact -->
  <section class="section section-alt" id="contact">
    <div class="container">
      <div class="section-header" id="contactHeader"></div>
      <div class="contact-layout" id="contactLayout"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script src="script.js"></script>
</body>
</html>
